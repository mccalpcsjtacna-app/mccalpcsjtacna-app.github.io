    <script>
    var repo = 'mccalpcsjtacna-app/mccalpcsjtacna-app.github.io';

    function parseFrontMatter(text) {
        var meta = {};
        var match = text.match(/^---\s*\n([\s\S]*?)\n---\s*\n/);
        if (match) {
            var lines = match[1].split('\n');
            for (var i = 0; i < lines.length; i++) {
                var colon = lines[i].indexOf(':');
                if (colon > 0) {
                    var key = lines[i].substring(0, colon).trim();
                    var val = lines[i].substring(colon + 1).trim();
                    if (val.startsWith('"') && val.endsWith('"')) val = val.slice(1, -1);
                    if (key === 'categories' || key === 'tags') {
                        val = val.replace(/[\[\]]/g, '').split(',').map(function(s) { return s.trim(); });
                    }
                    meta[key] = val;
                }
            }
        }
        return meta;
    }

    function getUrlParam(name) {
        var params = new URLSearchParams(window.location.search);
        return params.get(name);
    }

    function showError(msg) {
        document.getElementById('noticiaLoader').classList.add('d-none');
        var el = document.getElementById('noticiaError');
        el.textContent = msg;
        el.classList.remove('d-none');
    }

    function loadNoticia() {
        var filePath = getUrlParam('file');
        if (!filePath) {
            showError('No se especificó ninguna noticia.');
            return;
        }
        fetch('https://raw.githubusercontent.com/' + repo + '/main/' + filePath)
            .then(function(r) {
                if (!r.ok) throw new Error('Error al cargar la noticia');
                return r.text();
            })
            .then(function(content) {
                var meta = parseFrontMatter(content);
                var body = content;
                var fmMatch = content.match(/^---\s*\n[\s\S]*?\n---\s*\n/);
                if (fmMatch) {
                    body = content.substring(fmMatch[0].length);
                }
                document.getElementById('pageTitle').textContent = meta.title || 'Noticia';
                document.getElementById('breadcrumbCurrent').textContent = meta.title || 'Noticia';
                document.getElementById('noticiaTitle').textContent = meta.title || 'Sin título';
                document.getElementById('noticiaTipo').textContent = meta.tipo || 'General';

                var months = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Setiembre','Octubre','Noviembre','Diciembre'];
                if (meta.date) {
                    var d = new Date(meta.date);
                    document.getElementById('noticiaDate').textContent = d.getDate() + ' de ' + months[d.getMonth()] + ', ' + d.getFullYear();
                }
                document.getElementById('noticiaAuthor').textContent = meta.author || 'MCCALP';

                var imgEl = document.getElementById('noticiaImage');
                if (meta.image) {
                    imgEl.src = meta.image;
                    imgEl.alt = meta.title || 'Imagen de la noticia';
                    imgEl.onerror = function() { document.getElementById('noticiaImageContainer').classList.add('d-none'); };
                } else {
                    document.getElementById('noticiaImageContainer').classList.add('d-none');
                }

                document.getElementById('noticiaContent').innerHTML = marked.parse(body);
                document.getElementById('noticiaLoader').classList.add('d-none');
                document.getElementById('noticiaArticle').classList.remove('d-none');
            })
            .catch(function(err) {
                showError('Error al cargar la noticia: ' + err.message);
            });
    }

    loadNoticia();
    </script>
