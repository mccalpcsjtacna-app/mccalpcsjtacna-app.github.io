<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>MCCALP - Módulo Corporativo, Contencioso Administrativo Laboral y Previsional</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <meta content="Free HTML Templates" name="keywords">
    <meta content="Free HTML Templates" name="description">

    <!-- Favicon -->
    <link href="img/favicon.ico" rel="icon">

    <!-- Google Web Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Icon Font Stylesheet -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.4.1/font/bootstrap-icons.css" rel="stylesheet">

    <!-- Libraries Stylesheet -->
    <link href="lib/owlcarousel/assets/owl.carousel.min.css" rel="stylesheet">
    <link href="lib/animate/animate.min.css" rel="stylesheet">

    <!-- Customized Bootstrap Stylesheet -->
    <link href="css/bootstrap.min.css" rel="stylesheet">

    <!-- Template Stylesheet -->
    <link href="css/style.css" rel="stylesheet">
</head>

<body>
    <!-- Spinner Start -->
    <div id="spinner" class="show bg-white position-fixed translate-middle w-100 vh-100 top-50 start-50 d-flex align-items-center justify-content-center">
        <div class="spinner"></div>
    </div>
    <!-- Spinner End -->


    <div data-include="components/topbar.html"></div>


    <!-- Navbar Start -->
    <div class="container-fluid position-relative p-0">
        <div data-include="components/navbar.html"></div>
		
        <div class="container-fluid bg-primary py-5 bg-header" style="margin-bottom: 90px;">
            <div class="row py-5">
                <div class="col-12 pt-lg-5 mt-lg-5 text-center">
                    <h1 class="display-4 text-white animated zoomIn">Podcast</h1>
                    <a href="index.html" class="h5 text-white">Inicio</a>
                    <i class="far fa-circle text-white px-2"></i>
                    <a href="#" class="h5 text-white">Videoteca</a>
                </div>
            </div>
        </div>
    </div>
    <!-- Navbar End -->


    <div data-include="components/search-modal.html"></div>


    <!-- Podcast Start -->
    <div class="container-fluid py-5 wow fadeInUp" data-wow-delay="0.1s">
        <div class="container py-5">
            <div class="section-title text-center position-relative pb-3 mb-4 mx-auto" style="max-width: 600px;">
                <h5 class="fw-bold text-primary text-uppercase">Videoteca</h5>
                <h1 class="mb-0">Videos del MCCALP</h1>
            </div>
            <div class="row justify-content-center mb-5">
                <div class="col-lg-6 col-md-8 col-sm-12">
                    <div class="input-group">
                        <span class="input-group-text bg-primary text-white border-0"><i class="fa fa-search"></i></span>
                        <input type="text" id="searchInput" class="form-control form-control-lg border-primary" placeholder="Buscar por título o descripción..." onkeyup="filterVideos()">
                    </div>
                </div>
            </div>
            <div class="row" id="videoContainer">
            </div>
        </div>
    </div>
    <!-- Podcast End -->

    <!-- Video Modal -->
    <div class="modal fade" id="videoModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content bg-dark border-0">
                <div class="modal-header border-0 pb-0">
                    <h5 class="modal-title text-white" id="videoModalTitle"></h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close" onclick="closeVideoModal()"></button>
                </div>
                <div class="modal-body">
                    <div class="ratio ratio-16x9">
                        <iframe id="videoModalIframe" src="" allow="autoplay; encrypted-media" allowfullscreen></iframe>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <!-- Video Modal End -->


    <div data-include="components/footer.html"></div>

    <!-- JavaScript Libraries -->
    <script src="https://code.jquery.com/jquery-3.4.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="lib/wow/wow.min.js"></script>
    <script src="lib/easing/easing.min.js"></script>
    <script src="lib/waypoints/waypoints.min.js"></script>
    <script src="lib/counterup/counterup.min.js"></script>
    <script src="lib/owlcarousel/owl.carousel.min.js"></script>

    <!-- Template Javascript -->
    <script src="js/main.js"></script>

    <script src="js/include.js"></script>

    <style>
        .video-card {
            cursor: pointer;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            overflow: hidden;
        }
        .video-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
        }
        .video-thumb-wrap {
            position: relative;
            background: #000;
            overflow: hidden;
        }
        .video-thumb-wrap img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            transition: transform 0.4s ease;
        }
        .video-card:hover .video-thumb-wrap img {
            transform: scale(1.05);
        }
        .play-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0,0,0,0.3);
            transition: background 0.3s ease;
        }
        .video-card:hover .play-overlay {
            background: rgba(0,0,0,0.5);
        }
        .play-overlay .play-icon {
            width: 60px;
            height: 60px;
            background: rgba(255,255,255,0.9);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: #e74c3c;
            padding-left: 4px;
            transition: transform 0.3s ease;
        }
        .video-card:hover .play-overlay .play-icon {
            transform: scale(1.1);
        }
        .video-card .card-body {
            padding: 1.25rem;
        }
    </style>

    <script>
        var allVideos = [];

        function getGoogleDriveEmbedUrl(url) {
            var match = url.match(/\/d\/([a-zA-Z0-9_-]+)/);
            return match ? 'https://drive.google.com/file/d/' + match[1] + '/preview' : url;
        }

        function getGoogleDriveThumbnail(url) {
            var match = url.match(/\/d\/([a-zA-Z0-9_-]+)/);
            return match ? 'https://drive.google.com/thumbnail?id=' + match[1] + '&sz=w400' : 'img/video-placeholder.jpg';
        }

        function parseDate(dateStr) {
            var parts = dateStr.split('/');
            return new Date(parts[2], parts[1] - 1, parts[0]);
        }

        function openVideo(url, title) {
            document.getElementById('videoModalTitle').textContent = title;
            document.getElementById('videoModalIframe').src = getGoogleDriveEmbedUrl(url);
            var modal = new bootstrap.Modal(document.getElementById('videoModal'));
            modal.show();
        }

        function closeVideoModal() {
            document.getElementById('videoModalIframe').src = '';
        }

        function filterVideos() {
            var query = document.getElementById('searchInput').value.toLowerCase();
            var cards = document.querySelectorAll('.video-col');
            for (var i = 0; i < cards.length; i++) {
                var text = cards[i].getAttribute('data-search').toLowerCase();
                cards[i].style.display = text.indexOf(query) > -1 ? '' : 'none';
            }
        }

        function renderVideos(videos) {
            var container = document.getElementById('videoContainer');
            container.innerHTML = '';
            for (var j = 0; j < videos.length; j++) {
                var v = videos[j];
                var thumb = getGoogleDriveThumbnail(v.url);
                var col = document.createElement('div');
                col.className = 'col-lg-6 col-md-6 col-sm-12 mb-4 video-col';
                col.setAttribute('data-search', v.title + ' ' + v.description);
                col.innerHTML =
                    '<div class="bg-light rounded video-card h-100" onclick="openVideo(\'' + v.url.replace(/'/g, "\\'") + '\', \'' + v.title.replace(/'/g, "\\'") + '\')">' +
                        '<div class="video-thumb-wrap">' +
                            '<img src="' + thumb + '" alt="' + v.title + '" loading="lazy">' +
                            '<div class="play-overlay">' +
                                '<div class="play-icon"><i class="fa fa-play"></i></div>' +
                            '</div>' +
                        '</div>' +
                        '<div class="card-body">' +
                            '<h5 class="text-primary mb-1">' + v.title + '</h5>' +
                            '<p class="mb-1 text-muted">' + v.description + '</p>' +
                            '<small class="text-muted"><i class="fa fa-calendar me-1"></i>' + v.date + '</small>' +
                        '</div>' +
                    '</div>';
                container.appendChild(col);
            }
        }

        function loadVideos() {
            fetch('assets/podcast.csv')
                .then(function(response) { return response.text(); })
                .then(function(data) {
                    var lines = data.trim().split('\n');
                    for (var i = 1; i < lines.length; i++) {
                        var cols = lines[i].split(',');
                        if (cols.length >= 4) {
                            allVideos.push({
                                url: cols[0].trim(),
                                title: cols[1].trim(),
                                description: cols[2].trim(),
                                date: cols[3].trim()
                            });
                        }
                    }
                    allVideos.sort(function(a, b) {
                        return parseDate(b.date) - parseDate(a.date);
                    });
                    renderVideos(allVideos);
                });
        }
        loadVideos();
    </script>
</body>

</html>
