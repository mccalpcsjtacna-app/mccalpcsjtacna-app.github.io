<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>MCCALP - Módulo Corporativo Contencioso Administrativo Laboral y Previsional</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <meta content="MCCALP" name="keywords">
    <meta content="Módulo Corporativo Contencioso Administrativo Laboral y Previsional" name="description">

    <!-- Favicon -->
    <link href="img/logo-pj.png" rel="icon" type="image/png">

    <!-- Google Web Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Icon Font Stylesheet -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.4.1/font/bootstrap-icons.css" rel="stylesheet">

    <!-- Libraries Stylesheet -->
    <link href="lib/owlcarousel/assets/owl.carousel.min.css" rel="stylesheet">
    <link href="lib/animate/animate.min.css" rel="stylesheet">

    <!-- Customized Bootstrap Stylesheet -->
    <link href="css/bootstrap.min.css" rel="stylesheet">

    <!-- Template Stylesheet -->
    <link href="css/style.css" rel="stylesheet">
</head>

<body>
    <!-- Spinner Start -->
    <div id="spinner" class="show bg-white position-fixed translate-middle w-100 vh-100 top-50 start-50 d-flex align-items-center justify-content-center">
        <div class="spinner"></div>
    </div>
    <!-- Spinner End -->


    <div data-include="components/topbar.html"></div>


    <!-- Navbar Start -->
    <div class="container-fluid position-relative p-0">
        <div data-include="components/navbar.html"></div>

        <div class="container-fluid bg-primary py-5 bg-header" style="margin-bottom: 90px;">
            <div class="row py-5">
                <div class="col-12 pt-lg-5 mt-lg-5 text-center">
                    <h1 class="display-4 text-white animated zoomIn">Estadísticas</h1>
                    <a href="index.html" class="h5 text-white">Inicio</a>
                    <i class="far fa-circle text-white px-2"></i>
                    <a href="#" class="h5 text-white">Estadísticas</a>
                </div>
            </div>
        </div>
    </div>
    <!-- Navbar End -->


    <div data-include="components/search-modal.html"></div>


    <!-- Pricing Plan Start -->
	<div id="iframe-loader" style="display:flex; flex-direction:column; justify-content:center; align-items:center; min-height:400px; width:100%;">
		<div class="spinner"></div>
		<p class="mt-2" style="color:#971515; margin-top:10px;">Cargando estadísticas...</p>
	</div>
	<div style="display:flex; justify-content:center;">
		<iframe id="stats-iframe" src="https://lookerstudio.google.com/embed/reporting/b87c2e38-9f76-4b99-8276-868978859c22/page/onHmF"
		  frameborder="0" style="width:100%; max-width:1080px; border:0; display:none;" allowfullscreen sandbox="allow-storage-access-by-user-activation allow-scripts allow-same-origin allow-popups allow-popups-to-escape-sandbox">
		</iframe>
	</div>
	
    

    <div data-include="components/footer.html"></div>

    <!-- JavaScript Libraries -->
    <script src="https://code.jquery.com/jquery-3.4.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="lib/wow/wow.min.js"></script>
    <script src="lib/easing/easing.min.js"></script>
    <script src="lib/waypoints/waypoints.min.js"></script>
    <script src="lib/counterup/counterup.min.js"></script>
    <script src="lib/owlcarousel/owl.carousel.min.js"></script>

    <!-- Template Javascript -->
    <script src="js/main.js"></script>

    <script src="js/include.js"></script>

    <script>
    var iframe = document.getElementById('stats-iframe');
    var loader = document.getElementById('iframe-loader');

    window.addEventListener('message', function(e) {
        if (e.origin !== 'https://lookerstudio.google.com') return;
        try {
            var data = typeof e.data === 'string' ? JSON.parse(e.data) : e.data;
            if (data.height) {
                iframe.style.height = data.height + 'px';
            }
        } catch(err) {}
    });

    iframe.addEventListener('load', function() {
        loader.style.display = 'none';
        iframe.style.display = 'block';
        if (!iframe.style.height || iframe.style.height === '') {
            iframe.style.height = Math.max(window.innerHeight * 0.85, 400) + 'px';
        }
    });
    </script>
</body>

</html>
